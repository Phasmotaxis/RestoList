services:
  web:
    image: nginx:1.25-alpine
    container_name: eims_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - eims_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: eims_app:latest
    container_name: eims_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html:rw
      - ./docker/php/conf.d/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./storage:/var/www/html/storage:rw
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: eims_db
      DB_USER: eims_user
      DB_PASS: eims_password
      DB_SQLITE_PATH: /var/www/html/storage/fallback.sqlite
    networks:
      - eims_network

  db:
    image: mysql:8.0
    container_name: eims_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: eims_db
      MYSQL_USER: eims_user
      MYSQL_PASSWORD: eims_password
    volumes:
      - db_data:/var/lib/mysql
      - ./src/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - eims_network

networks:
  eims_network:
    driver: bridge

volumes:
  db_data:
    driver: local
